<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Theme Generator</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="api-client.js"></script>
<script type="module" src="page-auth.js"></script>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:30px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    color:#1E3A8A;
}

.upload-box{

    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);

}

button{

    margin-top:20px;
    padding:12px 25px;
    background:#F97316;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;

}

button:hover{

background:#ea580c;

}

#statusBanner {
    display:none;
    background:#fdecea;
    color:#b91c1c;
    border:1px solid #f5c2c7;
    padding:15px;
    border-radius:8px;
    margin-top:20px;
}

#loadingIndicator {
    display:none;
    margin-top:20px;
    font-size:16px;
    color:#334155;
}

.preview{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:20px;

margin-top:30px;

}

.card{

background:white;

padding:15px;

border-radius:10px;

box-shadow:0 3px 10px rgba(0,0,0,.1);

text-align:center;

}

.card img{

width:100%;

border-radius:8px;

}

</style>

</head>

<body>

<div class="container">

<h1>🏠 AI Exterior Theme Generator</h1>

<div class="upload-box">

    <input type="file" id="image" accept="image/jpeg,image/png,image/webp">

    <input type="text" id="themePrompt" placeholder="Optional AI palette, e.g. coastal blue with warm wood" style="display:block; width:100%; margin-top:15px; padding:12px; border:1px solid #cbd5e1; border-radius:6px;">

    <br>

    <button onclick="generateTheme()">

        Generate Themes

    </button>

    <div id="loadingIndicator">Generating themes, please wait...</div>
    <div id="statusBanner"></div>

</div>

<h2 style="margin-top:40px;">Generated Themes</h2>

<div id="themeSections">
    <div id="aiSection" style="display:none; margin-bottom:20px;">
        <h3 style="margin-bottom:10px;">AI-generated theme</h3>
        <div class="preview" id="aiPreview"></div>
    </div>
    <button id="toggleDefaultBtn" style="display:none; margin: 10px 0 0; padding: 10px 18px; border: 1px solid #ccc; border-radius: 8px; background: #fff; color: #1f2937; cursor: pointer;">Show default themes</button>
    <div id="defaultSection" style="display:none; margin-top:30px;">
        <h3 style="margin-bottom:10px;">Default themes</h3>
        <div class="preview" id="defaultPreview"></div>
    </div>
</div>

</div>

<script>

function createCard(theme) {
    const card = document.createElement('div');
    card.className = 'card';

    const title = document.createElement('h3');
    title.innerText = theme.name;
    card.appendChild(title);

    if (theme.source) {
        const source = document.createElement('p');
        source.style.margin = '6px 0 12px';
        source.style.fontSize = '0.95rem';
        source.style.color = '#475569';
        source.innerText = theme.source === 'AI' ? 'AI-generated theme' : 'Default theme';
        card.appendChild(source);
    }

    const img = document.createElement('img');
    img.src = theme.image + '?t=' + new Date().getTime();
    img.alt = theme.name;
    card.appendChild(img);

    return card;
}

async function generateTheme() {

    const file = document.getElementById("image").files[0];
    const loading = document.getElementById('loadingIndicator');
    const banner = document.getElementById('statusBanner');
    const aiPreview = document.getElementById('aiPreview');
    const defaultPreview = document.getElementById('defaultPreview');
    const aiSection = document.getElementById('aiSection');
    const defaultSection = document.getElementById('defaultSection');

    banner.style.display = 'none';
    banner.innerText = '';
    aiPreview.innerHTML = '';
    defaultPreview.innerHTML = '';
    aiSection.style.display = 'none';
    defaultSection.style.display = 'none';

    if (!file) {
        banner.style.display = 'block';
        banner.innerText = 'Please select an image before generating themes.';
        return;
    }

    const formData = new FormData();
    formData.append("file", file);
    formData.append("theme_prompt", document.getElementById('themePrompt').value.trim());

    loading.style.display = 'block';

    try {

        const response = await fetch("/api/theme-generator", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        loading.style.display = 'none';

        if (!response.ok) {
            throw new Error(data.detail || data.message || 'Theme generation failed.');
        }

        if (!data.themes || data.themes.length === 0) {
            banner.style.display = 'block';
            banner.innerText = data.message || "No themes returned.";
            return;
        }

        const toggleDefaultBtn = document.getElementById('toggleDefaultBtn');
        let defaultCount = 0;

        data.themes.forEach(theme => {
            if (theme.source === 'AI') {
                aiSection.style.display = 'block';
                aiPreview.appendChild(createCard(theme));
            } else {
                defaultCount += 1;
                defaultSection.style.display = 'block';
                defaultPreview.appendChild(createCard(theme));
            }
        });

        if (defaultCount > 0) {
            toggleDefaultBtn.style.display = 'inline-block';
            toggleDefaultBtn.innerText = 'Show default themes';
            defaultSection.style.display = 'none';
            toggleDefaultBtn.onclick = () => {
                if (defaultSection.style.display === 'none') {
                    defaultSection.style.display = 'block';
                    toggleDefaultBtn.innerText = 'Hide default themes';
                } else {
                    defaultSection.style.display = 'none';
                    toggleDefaultBtn.innerText = 'Show default themes';
                }
            };
        } else {
            toggleDefaultBtn.style.display = 'none';
        }

    }
    catch(err) {

        loading.style.display = 'none';
        banner.style.display = 'block';
        banner.innerText = err.message || 'Failed to generate themes. Please check the AI backend and try again.';
        console.error(err);

    }

}

</script>

</body>
</html>
